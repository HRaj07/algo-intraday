name: ⚡ IntraDay Algo Scanner

on:
  schedule:
    # Every 15 min during NSE market hours (Mon-Fri)
    # Market hours 9:00 AM - 3:30 PM IST = 3:30 UTC - 10:00 UTC
    # Run 3:30 UTC to 10:00 UTC (main.py handles out-of-hours gracefully)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:          # Manual trigger for testing

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Run Intraday Scan
    env:
      TZ: Asia/Kolkata

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "HRaj07"
          git config user.email "2601harshitraj@gmail.com"
          git add logs/ reports/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "⚡ Intraday: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            git push
          fi
