name: ⚡ IntraDay Algo Scanner

on:
  schedule:
    # Every 15 min during NSE market hours (Mon-Fri)
    # IST = UTC+5:30 -> Market hours 9:15 AM - 3:15 PM IST = 3:45 UTC - 9:45 UTC
    - cron: '45 3 * * 1-5'         # 9:15 AM IST
    - cron: '*/15 4-8 * * 1-5'     # 9:30 AM - 1:45 PM IST (every 15 min)
    - cron: '0,15,30,45 9 * * 1-5' # 2:00 PM - 3:15 PM IST (every 15 min)
  workflow_dispatch:          # Manual trigger for testing

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Run Intraday Scan
    env:
      TZ: Asia/Kolkata

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "HRaj07"
          git config user.email "2601harshitraj@gmail.com"
          git add logs/ reports/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "⚡ Intraday: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            git push
          fi
